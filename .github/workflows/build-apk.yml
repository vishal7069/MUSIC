name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --continue --stacktrace 2>&1 | tee build.log
      - name: Show errors on the summary page
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -n -E "What went wrong|^e: |error:|Unresolved|Could not|Failed|> " -A 12 build.log | grep -v "^\s*[0-9]*-\s*at " | head -250
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Dafli-apk
          path: app/build/outputs/apk/debug/app-debug.apk
